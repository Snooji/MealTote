<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MealTote</title>
<meta name="description" content="Meal plans with recipes, nutrition and one grocery list split across Trader Joe's, Aldi, Walmart and Costco.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" id="tf-market" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="src/app.css">
<link rel="stylesheet" href="src/themes.css">
<meta name="theme-color" content="#FFFFFF">
<script src="src/theme.js"></script>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="bar">
      <div class="brand"><h1>Meal<b>Tote</b></h1><span>meal plans across your stores</span></div>
      <div class="actions" id="hdrBtns"><div id="account"></div><a class="btn small support" href="support.html" aria-label="Support MealTote">♥ Support</a><button class="btn small" id="themeBtn" aria-label="Change theme">Theme</button><button class="btn small" id="resetBtn" hidden>My plans</button><button class="btn small" id="editBtn" hidden>Edit my answers</button></div>
    </div>
    <nav class="tabs" role="tablist" id="tabs" hidden>
      <button role="tab" data-tab="plan" aria-selected="true">My plan</button>
      <button role="tab" data-tab="prep" aria-selected="false">Meal prep</button>
      <button role="tab" data-tab="groceries" aria-selected="false">Groceries <span class="count" id="listCount">0</span></button>
      <button role="tab" data-tab="recipes" aria-selected="false">All recipes</button>
      <button role="tab" data-tab="pdf" aria-selected="false">Cookbook PDF</button>
    </nav>
  </div>
</header>

<main class="wrap" id="app"></main>

<footer class="site wrap">
  <p><b>MealTote is free</b>, with no ads and no paywall. If it saves you time or money, you can <a href="support.html">chip in to keep it running</a>.</p>
  <p class="note"><a href="support.html">Support</a> · <a href="https://github.com/Snooji/mealtote/issues" target="_blank" rel="noopener">Feedback &amp; ideas</a> · <a href="https://github.com/Snooji/mealtote/blob/main/CREDITS.md" target="_blank" rel="noopener">Photo credits</a></p>
</footer>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="dTitle">
  <div class="panel" id="panel"></div>
</div>
<input type="file" id="photoInput" accept="image/*" hidden>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="src/photos.js"></script>
<script src="src/recipes/breakfast.js"></script>
<script src="src/recipes/lunch.js"></script>
<script src="src/recipes/lunch-world.js"></script>
<script src="src/recipes/dinner-asia.js"></script>
<script src="src/recipes/dinner-world.js"></script>
<script src="src/recipes/us-latam.js"></script>
<script src="src/recipes/caribbean.js"></script>
<script src="src/recipes/southamerica.js"></script>
<script src="src/recipes/europe-west.js"></script>
<script src="src/recipes/europe-east.js"></script>
<script src="src/recipes/mena.js"></script>
<script src="src/recipes/africa.js"></script>
<script src="src/recipes/southasia.js"></script>
<script src="src/recipes/eastasia.js"></script>
<script src="src/recipes/seasia.js"></script>
<script src="src/app.js"></script>
<script type="module" src="src/cloud.js"></script>
</body>
</html>
