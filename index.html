<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bundle &amp; Bite</title>
<meta name="description" content="Meal plans with recipes, nutrition and one grocery list split across Trader Joe's, Aldi, Walmart and Costco.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="src/app.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="bar">
      <div class="brand"><h1>Bundle <b>&amp;</b> Bite</h1><span>meal plans across your stores</span></div>
      <div class="actions" id="hdrBtns"><div id="account"></div><button class="btn small" id="resetBtn" hidden>Start over</button><button class="btn small" id="editBtn" hidden>Edit my answers</button></div>
    </div>
    <nav class="tabs" role="tablist" id="tabs" hidden>
      <button role="tab" data-tab="plan" aria-selected="true">My plan</button>
      <button role="tab" data-tab="prep" aria-selected="false">Meal prep</button>
      <button role="tab" data-tab="groceries" aria-selected="false">Groceries <span class="count" id="listCount">0</span></button>
      <button role="tab" data-tab="recipes" aria-selected="false">All recipes</button>
      <button role="tab" data-tab="pdf" aria-selected="false">Cookbook PDF</button>
    </nav>
  </div>
</header>

<main class="wrap" id="app"></main>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="dTitle">
  <div class="panel" id="panel"></div>
</div>
<input type="file" id="photoInput" accept="image/*" hidden>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="src/photos.js"></script>
<script src="src/app.js"></script>
<script type="module" src="src/cloud.js"></script>
</body>
</html>
