<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>MealTote Backend</title>
<link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MealTote">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" id="tf-market" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="src/app.css">
<link rel="stylesheet" href="src/themes.css">
<meta name="theme-color" content="#FFFFFF">
<script src="src/theme.js"></script>
<style>
  .admin{max-width:920px;margin:28px auto 48px;display:grid;gap:18px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
  .tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:14px 16px;display:grid;gap:2px}
  .tile b{font-family:var(--f-mono);font-size:24px;font-weight:500}
  .tile span{font-size:12.5px;color:var(--muted)}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:16px 18px;display:grid;gap:12px}
  .card h3{margin:0}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
  .admin label.fld{display:grid;gap:4px}
  .admin input[type=text],.admin input[type=number],.admin input[type=date],.admin select,.admin textarea{width:100%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 10px;font:inherit}
  .admin textarea{min-height:84px;resize:vertical}
  .mrow{border:1px solid var(--line);border-radius:var(--r-card);padding:12px 14px;display:grid;gap:10px}
  .mrow.off{opacity:.6}
  .mrow .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .mrow .top b{margin-right:auto}
  .pill{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--muted)}
  table.log{width:100%;border-collapse:collapse;font-size:14px}
  table.log th,table.log td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
  table.log td.n{font-family:var(--f-mono);text-align:right;white-space:nowrap}
  table.log th.n{text-align:right}
  .meter{height:10px;border-radius:99px;background:var(--sunk);overflow:hidden}
  .meter i{display:block;height:100%;background:var(--accent)}
  .tabs2{display:flex;gap:6px;flex-wrap:wrap}
  .gate{max-width:520px;margin:60px auto;text-align:center;display:grid;gap:14px;justify-items:center}
  .savebar{position:sticky;bottom:0;background:var(--bg);padding:12px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line)}
  @media (max-width:640px){ table.log .hide-s{display:none} }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="bar">
      <div class="brand"><img class="mark" src="icons/mark.png" alt="" width="34" height="34"><h1><a href="./" style="color:inherit;text-decoration:none">Meal<b>Tote</b></a></h1><span>Backend</span></div>
      <div class="actions"><a class="btn small desk" href="support.html">View support page</a><span id="who"></span><a class="btn small primary" href="./" aria-label="Close the Backend">✕ Close</a></div>
    </div>
  </div>
</header>
<main class="wrap" id="app"><div class="gate"><p class="note">Loading…</p></div></main>
<div class="toast" id="toast" hidden></div>
<script src="src/donate.js"></script>
<script type="module" src="src/admin.js"></script>
</body>
</html>
