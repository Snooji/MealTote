# Publishes the Instacart checkout worker (worker/) to Cloudflare.
# Needs repo secrets CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and INSTACART_API_KEY.
# Optional repo variable INSTACART_ENV = "prod" once Instacart approves the production key (default "dev").
name: Deploy checkout worker
on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/checkout-worker.yml"]
  workflow_dispatch:
jobs:
  worker:
    runs-on: ubuntu-latest
    env:
      READY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' && secrets.INSTACART_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        if: env.READY == 'true'
        uses: cloudflare/wrangler-action@v3
        env:
          INSTACART_API_KEY: ${{ secrets.INSTACART_API_KEY }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          secrets: |
            INSTACART_API_KEY
          command: deploy --var INSTACART_ENV:${{ vars.INSTACART_ENV || 'dev' }}
      - name: Deploy skipped
        if: env.READY != 'true'
        run: echo "Add CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and INSTACART_API_KEY repo secrets to publish the checkout worker."
