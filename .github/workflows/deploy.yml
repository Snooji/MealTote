# Publishes the site to Firebase Hosting (mealtote.com) on every push to main.
# Needs the FIREBASE_SERVICE_ACCOUNT_MEALTOTE_DA8A7 repo secret, which `firebase init hosting:github` creates.
# Until that secret exists, the deploy step is skipped instead of failing.
name: Deploy to Firebase Hosting
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MEALTOTE_DA8A7 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check the app script parses
        run: node --check src/app.js
      - name: Deploy
        if: env.HAS_KEY == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MEALTOTE_DA8A7 }}
          channelId: live
          projectId: mealtote-da8a7
      # database rules go out only when firestore.rules changed (or on a manual run)
      - name: Deploy Firestore rules
        if: env.HAS_KEY == 'true'
        env:
          SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MEALTOTE_DA8A7 }}
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && git diff --quiet HEAD~1 HEAD -- firestore.rules; then echo "firestore.rules unchanged"; exit 0; fi
          printf '%s' "$SA_KEY" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" npx -y firebase-tools@13 deploy --only firestore:rules --project mealtote-da8a7 --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
      - name: Deploy skipped
        if: env.HAS_KEY != 'true'
        run: echo "Add the FIREBASE_SERVICE_ACCOUNT_MEALTOTE_DA8A7 secret (firebase init hosting:github) to turn on automatic deploys."
