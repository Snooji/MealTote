# Publishes the site to Firebase Hosting (mealtote.com) on every push to main.
# Needs the FIREBASE_SERVICE_ACCOUNT_MEALTOTE_DA8A7 repo secret, which `firebase init hosting:github` creates.
# Until that secret exists, the deploy step is skipped instead of failing.
name: Deploy to Firebase Hosting
on:
  push:
    branches: [main]
  workflow_dispatch:
  # once a day, so the recipe pages pick up new ratings
  schedule:
    - cron: "23 7 * * *"
concurrency:
  group: deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MEALTOTE_DA8A7 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check the app script parses
        run: node --check src/app.js
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # rebuild the public recipe pages with the latest ratings from the app
      - name: Refresh recipe pages
        run: node tools/export-cookbook.mjs
      # the Instacart checkout worker's address (repo variable CHECKOUT_URL); the button stays hidden until it's set
      - name: Checkout config
        env:
          CHECKOUT_URL: ${{ vars.CHECKOUT_URL }}
        run: |
          if [ -n "$CHECKOUT_URL" ]; then node -e 'process.stdout.write("window.MT_CHECKOUT="+JSON.stringify(process.env.CHECKOUT_URL.replace(/\/+$/,""))+";\n")' > src/checkout-config.js; fi
          cat src/checkout-config.js
      # the app compares this with what it's running and reloads itself when a new version is live
      - name: Stamp version
        run: printf '{"v":"%s"}\n' "$GITHUB_SHA" > version.json
      - name: Deploy
        if: env.HAS_KEY == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MEALTOTE_DA8A7 }}
          channelId: live
          projectId: mealtote-da8a7
      # database rules go out only when firestore.rules changed (or on a manual run)
      - name: Deploy Firestore rules
        if: env.HAS_KEY == 'true'
        # until the deploy key has the Firebase Rules Admin role this fails; the site itself is already deployed above
        continue-on-error: true
        env:
          SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MEALTOTE_DA8A7 }}
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && git diff --quiet HEAD~1 HEAD -- firestore.rules; then echo "firestore.rules unchanged"; exit 0; fi
          printf '%s' "$SA_KEY" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" npx -y firebase-tools@13 deploy --only firestore:rules --project mealtote-da8a7 --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
      - name: Deploy skipped
        if: env.HAS_KEY != 'true'
        run: echo "Add the FIREBASE_SERVICE_ACCOUNT_MEALTOTE_DA8A7 secret (firebase init hosting:github) to turn on automatic deploys."
